name: Add a presentation
description: Collect a talk, poster or conference update for the academic profile.
title: "[Presentation] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public repository. Submitted text and attachments will be visible publicly.
        This form collects material for an update. It does not automatically publish a website entry or post to external platforms.
  - type: input
    id: title
    attributes:
      label: Presentation title
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: Event name
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Presentation date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: City, country, or online
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Talk
        - Poster
        - Invited lecture
        - Other
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Presenter and co-authors
  - type: textarea
    id: summary
    attributes:
      label: Brief summary
      description: What did you present, and what should readers take away?
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Photographs and slides
      description: Drag public event photographs or a slide PDF here, or paste public links. Include captions and photograph credits where relevant.
  - type: input
    id: event_url
    attributes:
      label: Event or programme link
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any wording preferences or acknowledgements to include?
